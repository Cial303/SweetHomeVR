<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Sweet Home VR</title>
	<meta name="description" content="View Sweet Home 3D homes as a dollhouse and walk through them in VR on Meta Quest.">
	<!--
		Content Security Policy: the page may only run its own scripts (plus the
		import map below, pinned by its hash), show its own or in-memory images,
		and download models over https. Nothing else: no outside scripts, frames,
		fonts or plugins. If you edit the import map, update the hash
		(npm test prints the right one). To enable the Dropbox Chooser, add
		https://www.dropbox.com to script-src and frame-src (see README).
	-->
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-hUvon5CVPXLquT3WJNr9I0hyTxeK5RACPxDkF4pZIVs='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https: data: blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
	<!-- Sites we download a model from are not told which page asked. -->
	<meta name="referrer" content="no-referrer">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15 16 5l12 10v12H4z' fill='%23d9822b'/%3E%3Cpath d='M13 27v-8h6v8' fill='%23fff'/%3E%3C/svg%3E">
	<style>
		:root {
			--bg: #eef1f4;
			--panel: rgba(255, 255, 255, 0.94);
			--text: #1d2329;
			--muted: #5d6873;
			--line: #d5dbe1;
			--accent: #d9822b;
			--accent-text: #ffffff;
			--xr: #2f5fd0; /* the headset button: distinct from the orange "open" actions */
			--xr-text: #ffffff;
			--warn: #b3261e;
			--radius: 14px;
			--gap: 12px; /* distance from the window edges */
			--bar-h: 72px; /* height of the bottom bar; kept up to date by main.js */
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #15191d;
				--panel: rgba(28, 33, 38, 0.94);
				--text: #e8ecef;
				--muted: #9aa5af;
				--line: #39424b;
				--warn: #ff8a80;
				--xr: #4f7cf0;
			}
		}
		* { box-sizing: border-box; }
		html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
			font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
		#viewport { position: fixed; inset: 0; }
		#viewport canvas { display: block; width: 100%; height: 100%; touch-action: none; }
		[hidden] { display: none !important; }

		/* Controls: at least 40 px tall, so a Quest controller laser hits them easily. */
		button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--text);
			border-radius: 9px; padding: 0 12px; min-height: 40px; cursor: pointer; text-align: center; }
		button:hover { border-color: var(--accent); }
		button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
		button:disabled { opacity: .5; cursor: default; }
		button.link { border: 0; min-height: 0; padding: 0; color: var(--accent); text-decoration: underline; font-size: inherit; }
		input[type=url], select { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line);
			border-radius: 9px; padding: 0 10px; min-height: 40px; width: 100%; min-width: 0; }
		h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0; font-weight: 600; }
		.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
		.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
			backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(0,0,0,.12); }

		/* ---- Files card (top left). It never reaches the bottom bar; if the
		   window is very short only the Recent list scrolls. ---- */
		#panel { position: fixed; top: var(--gap); left: var(--gap); width: min(330px, calc(100vw - 2 * var(--gap)));
			max-height: calc(100vh - var(--bar-h) - 3 * var(--gap)); display: flex; flex-direction: column; padding: 12px 14px; gap: 10px; }
		#panel header { display: flex; align-items: center; gap: 8px; }
		h1 { font-size: 19px; margin: 0; flex: 1; letter-spacing: -0.01em; }
		h1 span { color: var(--accent); }
		#collapse { min-height: 32px; padding: 0 11px; }
		#panel.collapsed > :not(header) { display: none; }
		.panel-body { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
		#file-input { display: none; }
		.link-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
		#status { color: var(--muted); font-size: 13.5px; min-height: 1.4em; overflow-wrap: anywhere; }
		#status.error { color: var(--warn); }
		#recent-section { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
		#recent { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; overflow-y: auto; min-height: 36px; }
		#recent button { min-height: 36px; }
		/* A grid, so the name can shrink and the icon buttons always fit inside the card. */
		#recent li { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 5px; }
		#recent li.with-refresh { grid-template-columns: minmax(0, 1fr) 40px 40px; }
		.recent-open { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; text-align: left; padding: 0 10px; min-width: 0; }
		.recent-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
		.recent-meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
		.recent-icon { padding: 0; font-size: 18px; min-width: 0; width: 40px; }
		details { font-size: 13px; }
		summary { cursor: pointer; color: var(--muted); }
		details .row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
		details .row label { color: var(--muted); flex: 0 0 auto; }

		/* ---- Model details, over the view at the top right ---- */
		#stats { position: fixed; top: var(--gap); right: calc(var(--gap) + 2px); max-width: min(420px, calc(100vw - 380px)); text-align: right;
			font-size: 13px; line-height: 1.5; color: #1d2329; font-variant-numeric: tabular-nums; pointer-events: none;
			text-shadow: 0 0 3px rgba(255,255,255,.9), 0 0 8px rgba(255,255,255,.6); }
		#stats .warn { color: #b3261e; }
		#stats .name { font-weight: 600; font-size: 14px; }
		body.dark-sky #stats { color: #f1f4f7; text-shadow: 0 0 3px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.6); }
		body.dark-sky #stats .warn { color: #ff9a90; }

		/* ---- Bottom bar: always on screen. How the model is shown, and Enter VR. ---- */
		#bar { position: fixed; left: var(--gap); right: var(--gap); bottom: var(--gap); display: flex; flex-wrap: wrap; align-items: center;
			gap: 10px 22px; padding: 10px 14px; }
		.bar-item { display: flex; align-items: center; gap: 10px; }
		.bar-label { color: var(--muted); font-size: 13px; }
		/* Light: four buttons in one strip, one click each. */
		.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
		.seg button { border: 0; border-radius: 0; padding: 0 13px; border-left: 1px solid var(--line); }
		.seg button:first-child { border-left: 0; }
		.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-text); font-weight: 600; }
		/* On/off switch (a checkbox underneath, so it works with keyboard and screen readers). */
		.switch { display: flex; align-items: center; gap: 9px; cursor: pointer; min-height: 40px; }
		.switch input { appearance: none; -webkit-appearance: none; flex: 0 0 auto; width: 46px; height: 26px; margin: 0; border-radius: 13px;
			background: var(--line); position: relative; cursor: pointer; transition: background .15s; }
		.switch input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
			background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: transform .15s; }
		.switch input:checked { background: var(--accent); }
		.switch input:checked::after { transform: translateX(20px); }
		.switch input:focus-visible { outline: 2px solid var(--xr); outline-offset: 2px; }
		.switch small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.2; }
		#xr-buttons { margin-left: auto; display: flex; align-items: center; }
		button.xr { background: var(--xr); border-color: var(--xr); color: var(--xr-text); font-weight: 700; font-size: 17px;
			min-height: 48px; padding: 0 26px; border-radius: 11px; white-space: nowrap; }
		button.xr:hover { filter: brightness(1.1); border-color: var(--xr); }
		button.xr svg { width: 24px; height: 24px; vertical-align: -6px; margin-right: 8px; }
		#xr-buttons .hint { max-width: 220px; text-align: right; }

		/* Narrow windows (a phone, or a small Quest Browser window): the bar
		   wraps, Enter VR takes the full width, details sit above the bar. */
		@media (max-width: 760px) {
			#bar { gap: 8px 16px; }
			#xr-buttons { margin-left: 0; flex: 1 1 100%; }
			button.xr { width: 100%; }
			#xr-buttons .hint { max-width: none; text-align: left; }
			#stats { top: auto; bottom: calc(var(--bar-h) + 2 * var(--gap)); max-width: calc(100vw - 2 * var(--gap)); }
			.seg button { padding: 0 10px; }
		}
		/* Dropping files on the page */
		body.dropping #viewport { outline: 3px dashed var(--accent); outline-offset: -10px; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "./vendor/three/three.module.js",
			"three/addons/": "./vendor/three/addons/",
			"three-mesh-bvh": "./vendor/three-mesh-bvh/index.module.js",
			"fflate": "./vendor/fflate/fflate.module.js"
		}
	}
	</script>
</head>
<body>
	<div id="viewport"></div>

	<!-- Files: open a model, or reopen a recent one. -->
	<aside id="panel" class="card">
		<header>
			<h1>Sweet Home <span>VR</span></h1>
			<button id="collapse" title="Hide this panel" aria-label="Hide this panel" aria-expanded="true">–</button>
		</header>
		<div class="panel-body">
			<!-- No restrictive accept attribute: Quest Browser greys out uncommon extensions. -->
			<input type="file" id="file-input" multiple>
			<button id="open-dropbox" class="primary" hidden>Open from Dropbox</button>
			<button id="open-file" class="primary">Open file</button>
			<div class="link-row">
				<input type="url" id="link-input" placeholder="Paste a Dropbox or web link" autocomplete="off" aria-label="Link to a model">
				<button id="open-link">Open</button>
			</div>
			<p class="hint" title="Sweet Home 3D 5.3 or later (.sh3d), a zip, an OBJ with its .mtl and textures, or a GLB">.sh3d, .zip, .obj or .glb · <button id="open-example" class="link">Try the example home</button></p>
			<div id="status" role="status"></div>
			<section id="recent-section" hidden>
				<h2>Recent</h2>
				<ul id="recent"></ul>
			</section>
			<details>
				<summary>File options</summary>
				<div class="row">
					<label for="units">OBJ units</label>
					<select id="units">
						<option value="auto">Auto</option>
						<option value="cm">cm</option>
						<option value="m">m</option>
						<option value="mm">mm</option>
						<option value="in">in</option>
					</select>
				</div>
			</details>
		</div>
	</aside>

	<!-- Technical details of the open model, over the top right of the view. -->
	<div id="stats" aria-live="polite"></div>

	<!-- Always on screen: how the model is shown, and the way into the headset. -->
	<footer id="bar" class="card">
		<div class="bar-item">
			<span class="bar-label" id="time-label">Light</span>
			<div class="seg" id="time" role="radiogroup" aria-labelledby="time-label">
				<button role="radio" data-value="morning" aria-checked="true">Morning</button>
				<button role="radio" data-value="noon" aria-checked="false">Noon</button>
				<button role="radio" data-value="sunset" aria-checked="false">Sunset</button>
				<button role="radio" data-value="night" aria-checked="false">Night</button>
			</div>
		</div>
		<label class="switch">
			<input type="checkbox" role="switch" id="shadows">
			<span>Shadows</span>
		</label>
		<label class="switch" title="Darkens corners and gives each wall its own shade, so shapes read better. Shown in the headset only.">
			<input type="checkbox" role="switch" id="depth">
			<span>Depth shading <small id="depth-note">in VR only</small></span>
		</label>
		<div id="xr-buttons"></div>
	</footer>

	<script type="module" src="./js/main.js"></script>
</body>
</html>
